<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ajandam</title>
<style>
:root{
  --bg:#0f1115;--surface:#181b22;--surface2:#222631;--line:#2a2f3b;
  --text:#e9ebf1;--dim:#8a90a0;--accent:#7c9cff;--accent-text:#0b1020;
  --green:#4cc38a;--red:#ff6b6b;--amber:#f0b45a;
}
:root[data-theme="light"]{
  --bg:#f3f4f7;--surface:#ffffff;--surface2:#e9ebf0;--line:#dcdfe6;
  --text:#171a21;--dim:#6a7080;--accent:#3d63dd;--accent-text:#ffffff;
  --green:#1f9d63;--red:#d64545;--amber:#b87a14;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

/* Üst başlık */
#hdr{padding:calc(10px + env(safe-area-inset-top)) 12px 8px;flex:none}
.hrow{display:flex;align-items:center;gap:6px}
.hmain{flex:1;min-width:0;text-align:left;padding:4px 6px}
.htitle{font-size:26px;font-weight:700;letter-spacing:-.02em}
.hsub{color:var(--dim);font-size:14px;margin-top:1px}
.navbtn{width:44px;height:44px;border-radius:12px;font-size:24px;color:var(--dim);flex:none}
.navbtn:active{background:var(--surface2)}
.prog{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;padding:0 6px;flex:none}
.prog small{color:var(--dim);font-weight:500}
.bar{height:4px;background:var(--surface2);border-radius:2px;margin:8px 6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .15s}
.chip{background:var(--surface2);color:var(--accent);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;flex:none}

/* İçerik */
#main{flex:1;overflow-y:auto;padding:4px 12px 16px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.sec{color:var(--dim);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:16px 6px 6px}
.empty{color:var(--dim);font-size:14px;padding:10px 6px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:0 4px 0 14px;min-height:56px;margin-bottom:6px;-webkit-touch-callout:none;transition:transform .12s}
.item:active{background:var(--surface2)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--accent-text)}
.item[data-kind="r"] .check{border-radius:8px}
.item.done .check{background:var(--green);border-color:var(--green)}
.item.done .check::after{content:"✓"}
.item.done .title{color:var(--dim);text-decoration:line-through}
.item.skip .check{border-style:dashed;opacity:.5}
.item.skip .title{color:var(--dim)}
.txt{flex:1;min-width:0;padding:10px 0}
.title{display:block;overflow-wrap:anywhere}
.meta{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.meta.miss{color:var(--red)}
.more{width:44px;height:52px;color:var(--dim);font-size:22px;flex:none;border-radius:12px}

/* Devir kartı */
.carry{background:var(--surface);border:1px solid var(--amber);border-radius:14px;padding:12px;margin:8px 0 4px}
.carry b{display:block;margin-bottom:10px}
.carry .btns{display:flex;gap:6px}
.carry button{flex:1;min-height:44px;border-radius:10px;background:var(--surface2);font-size:14px;font-weight:600;padding:0 6px}
.carry button.pri{background:var(--amber);color:#1b1304}

/* Takvim */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dowh{text-align:center;color:var(--dim);font-size:12px;font-weight:600;padding:6px 0}
.cell{aspect-ratio:1/1.05;border-radius:12px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums}
.cell:active{background:var(--surface2)}
.cell.past .n{color:var(--dim)}
.cell.today{outline:2px solid var(--accent);outline-offset:-2px}
.cell.sel{background:var(--surface2)}
.cell .n{font-size:16px;font-weight:600}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-text);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.badge.ok{background:none;color:var(--green)}
.badge.none{visibility:hidden}

/* Rutinler */
.ritem{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:14px;padding:0 8px 0 0;min-height:60px;margin-bottom:6px}
.ritem.off .title{color:var(--dim)}
.rmain{flex:1;min-width:0;text-align:left;padding:10px 6px 10px 14px}
.ord{width:40px;height:48px;color:var(--dim);font-size:18px;border-radius:10px}
.ord:active{background:var(--surface2)}
.ord:disabled{opacity:.25}
.switch{width:46px;height:28px;border-radius:14px;background:var(--surface2);position:relative;flex:none;margin-left:4px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:transform .12s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(18px);background:#fff}

/* Ayarlar */
.card{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0 0 12px;color:var(--dim);font-size:14px}
.btn{display:block;width:100%;min-height:50px;border-radius:12px;background:var(--surface2);font-weight:600;margin-top:8px;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-text)}
.btn.danger{color:var(--red)}
.btn:active{opacity:.8}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}

/* Hızlı ekleme + sekmeler */
#toastWrap{position:relative;height:0;flex:none;z-index:30}
#toast{position:absolute;left:12px;right:12px;bottom:8px;background:var(--text);color:var(--bg);border-radius:12px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:8px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#toast span{flex:1}
#toast button{min-height:40px;padding:0 14px;font-weight:700;color:var(--bg);border-radius:8px;background:rgba(127,127,127,.25)}
#addBar{display:flex;gap:6px;padding:8px 12px;flex:none;background:var(--bg);border-top:1px solid var(--line)}
#addInput{flex:1;min-width:0;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;outline:none}
#addInput:focus{border-color:var(--accent)}
#addInput::placeholder{color:var(--dim)}
.sq{width:50px;height:50px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.sq.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-size:26px;font-weight:500}
.sq.set{border-color:var(--accent);color:var(--accent)}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs{display:flex;flex:none;background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim);font-size:11px;font-weight:600}
#tabs button.on{color:var(--accent)}

/* Alt sayfa */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));max-height:86dvh;overflow-y:auto;animation:up .14s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet h2{font-size:16px;margin:2px 6px 10px;overflow-wrap:anywhere}
#sheet .opt{display:flex;align-items:center;width:100%;min-height:54px;padding:0 14px;border-radius:12px;text-align:left;font-size:17px}
#sheet .opt:active{background:var(--surface2)}
#sheet .opt.danger{color:var(--red)}
#sheet .opt small{margin-left:auto;color:var(--dim);font-size:14px}
#sheet input[type=text]{width:100%;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;outline:none;margin-bottom:8px}
#sheet input[type=text]:focus{border-color:var(--accent)}
#sheet .cell{background:var(--bg)}
.days{display:flex;gap:4px;margin:6px 0}
.days button{flex:1;height:46px;border-radius:10px;background:var(--bg);font-size:13px;font-weight:600;color:var(--dim)}
.days button.on{background:var(--accent);color:var(--accent-text)}
.pickrow{display:flex;align-items:center;gap:12px;min-height:52px;padding:4px 8px;border-radius:12px;width:100%;text-align:left}
.pickrow .check{border-radius:8px}
.pickrow.on .check{background:var(--accent);border-color:var(--accent)}
.pickrow.on .check::after{content:"✓"}
.note{color:var(--dim);font-size:13px;margin:6px 8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <main id="main"></main>
  <div id="toastWrap"><div id="toast" hidden><span></span><button data-act="undo">Geri al</button></div></div>
  <form id="addBar" autocomplete="off">
    <input id="addInput" type="text" enterkeyhint="done" maxlength="200" aria-label="Hızlı ekle">
    <button type="button" class="sq" id="addDate" data-act="addDate" aria-label="Başka güne ekle"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
    <button type="submit" class="sq pri" aria-label="Ekle">+</button>
  </form>
  <nav id="tabs">
    <button data-act="tab" data-tab="day"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Bugün</button>
    <button data-act="tab" data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Takvim</button>
    <button data-act="tab" data-tab="routines"><svg viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h11l-3-3M20 13v2a3 3 0 0 1-3 3H6l3 3"/></svg>Rutinler</button>
    <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Ayarlar</button>
  </nav>
</div>
<div id="backdrop" data-act="close" hidden></div>
<div id="sheet" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* ============ Yardımcılar ============ */
const KEY = 'ajandam.v1';
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const DAYS = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const DAYS_S = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const dow = s => (parse(s).getDay() + 6) % 7;            // Pazartesi = 0
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const shortDate = s => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0, 3)}`; };
const longDate = s => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${DAYS[dow(s)]}` + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); };
const relLabel = s => { const n = diffDays(s, ui.today); return n === 0 ? 'Bugün' : n === 1 ? 'Yarın' : n === -1 ? 'Dün' : DAYS[dow(s)]; };

/* ============ Veri katmanı ============
   routines: {id, lineage, title, days: null(her gün) | [0..6], start, end, active, inactiveSince, order}
             Geçmişte kullanılmış bir rutin düzenlenince/silinince eski sürüm "end" ile kapatılır,
             yeni sürüm bugünden başlar; "lineage" sürümleri birbirine bağlar (v2 istatistikleri için).
   tasks:    {id, title, date, done, history:[eski tarihler], created, ignored}
   log:      { 'YYYY-MM-DD': { rutinId: 'done' | 'skip' } }                                   */
const blank = () => ({ v: 1, routines: [], tasks: [], log: {}, settings: { theme: 'dark' } });
function normalize(s) {
  s.v = 1; s.log = s.log || {}; s.settings = s.settings || { theme: 'dark' };
  s.tasks.forEach(t => { t.history = t.history || []; });
  s.routines.forEach((r, i) => { if (r.order == null) r.order = i; if (!r.lineage) r.lineage = r.id; if (r.active == null) r.active = true; });
  return s;
}
const valid = s => s && Array.isArray(s.routines) && Array.isArray(s.tasks);
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (valid(s)) return normalize(s); } catch (e) {} return blank(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { toast('Kaydedilemedi: depolama dolu olabilir'); } }

let state = load();
const ui = { tab: 'day', today: fmt(new Date()), date: fmt(new Date()), calMonth: fmt(new Date()).slice(0, 7), addTarget: null };

const byOrder = (a, b) => a.order - b.order;
const routineOn = (r, date) => r.start <= date && (!r.end || date <= r.end)
  && (r.active || (r.inactiveSince && date < r.inactiveSince))
  && (!r.days || r.days.includes(dow(date)));
const routinesFor = date => state.routines.filter(r => routineOn(r, date)).sort(byOrder);
const currentRoutines = () => state.routines.filter(r => !r.end).sort(byOrder);
const findTask = id => state.tasks.find(t => t.id === id);
const findRoutine = id => state.routines.find(r => r.id === id);
const carryList = () => state.tasks.filter(t => !t.done && !t.ignored && t.date < ui.today);
function dayData(date) {
  const lg = state.log[date] || {};
  const routines = routinesFor(date).map(r => ({ r, st: lg[r.id] || null }));
  const tasks = state.tasks.filter(t => t.date === date);
  return { routines, tasks,
    total: routines.filter(x => x.st !== 'skip').length + tasks.length,
    done: routines.filter(x => x.st === 'done').length + tasks.filter(t => t.done).length };
}
function repeatText(days) {
  if (!days) return 'Her gün';
  const k = days.join('');
  if (k === '01234') return 'Hafta içi';
  if (k === '56') return 'Hafta sonu';
  return days.map(d => DAYS_S[d]).join(', ');
}

/* Değişiklik + 5 sn geri al */
let undoSnap = null, toastTimer = null;
function mutate(msg, fn) {
  const snap = JSON.stringify(state);
  fn(); save(); render();
  if (msg) toast(msg, snap);
}
function toast(msg, snap) {
  const t = $('#toast');
  undoSnap = snap || null;
  t.firstElementChild.textContent = msg;
  t.lastElementChild.hidden = !snap;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; undoSnap = null; }, 5000);
}

/* ---- Görev işlemleri ---- */
function addTask(title, date) {
  state.tasks.push({ id: uid(), title, date, done: false, history: [], created: Date.now() });
}
function moveTask(t, date) {
  if (t.date === date) return;
  t.history.push(t.date); t.date = date; delete t.ignored;
}
/* ---- Rutin işlemleri (geçmişi koruyarak) ---- */
function addRoutine(title) {
  const id = uid();
  const order = state.routines.reduce((m, r) => Math.max(m, r.order), -1) + 1;
  state.routines.push({ id, lineage: id, title, days: null, start: ui.today, end: null, active: true, order });
}
function editRoutine(r, title, days) {
  const t = ui.today;
  if (r.start >= t) { r.title = title; r.days = days; return; }
  const n = { ...r, id: uid(), start: t, title, days };
  if (!r.active) n.inactiveSince = t;
  r.end = addDays(t, -1);
  state.routines.push(n);
  const lg = state.log[t];
  if (lg && lg[r.id]) { lg[n.id] = lg[r.id]; delete lg[r.id]; }
}
function deleteRoutine(r) {
  const t = ui.today;
  if (r.start >= t) state.routines = state.routines.filter(x => x !== r);
  else { r.end = addDays(t, -1); if (state.log[t]) delete state.log[t][r.id]; }
}
function toggleRoutineActive(r) {
  const t = ui.today;
  if (r.active) { r.active = false; r.inactiveSince = t; return; }
  const since = r.inactiveSince;
  r.active = true; delete r.inactiveSince;
  if (!since || since >= t) return;                 // aynı gün içinde kapatıp açıldı
  if (r.start >= since) { r.start = t; return; }    // geçmişte hiç aktif olmadı
  const n = { ...r, id: uid(), start: t, end: null };
  r.end = addDays(since, -1);                       // aradaki pasif günler "yapılmadı" sayılmasın
  state.routines.push(n);
}

/* ============ Çizim ============ */
function render() {
  document.documentElement.dataset.theme = state.settings.theme;
  $('meta[name=theme-color]').content = state.settings.theme === 'light' ? '#f3f4f7' : '#0f1115';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  const scroll = $('#main').scrollTop;
  ({ day: renderDay, cal: renderCal, routines: renderRoutines, settings: renderSettings })[ui.tab]();
  $('#main').scrollTop = scroll;
  // hızlı ekleme çubuğu
  const bar = $('#addBar'), inp = $('#addInput');
  bar.hidden = ui.tab === 'cal' || ui.tab === 'settings';
  $('#addDate').hidden = ui.tab !== 'day';
  $('#addDate').classList.toggle('set', !!ui.addTarget);
  if (ui.tab === 'routines') inp.placeholder = 'Yeni rutin ekle…';
  else {
    const d = ui.addTarget || ui.date;
    inp.placeholder = d === ui.today ? 'Bugüne ekle…' : `${shortDate(d)} ${DAYS_S[dow(d)]} için ekle…`;
  }
}

function itemHTML(kind, id, title, cls, meta, miss) {
  return `<div class="item ${cls}" data-act="toggle" data-kind="${kind}" data-id="${id}">
    <span class="check"></span>
    <span class="txt"><span class="title">${esc(title)}</span>${meta ? `<span class="meta ${miss ? 'miss' : ''}">${meta}</span>` : ''}</span>
    <button class="more" data-act="menu" aria-label="Menü">⋯</button></div>`;
}

function renderDay() {
  const date = ui.date, past = date < ui.today, isToday = date === ui.today;
  const d = dayData(date);
  $('#hdr').innerHTML = `<div class="hrow">
      <button class="navbtn" data-act="nav" data-d="-1" aria-label="Önceki gün">‹</button>
      <button class="hmain" data-act="goToday"><div class="htitle">${relLabel(date)}</div><div class="hsub">${longDate(date)}</div></button>
      ${isToday ? '' : '<button class="chip" data-act="goToday">Bugün</button>'}
      <div class="prog">${d.total ? `${d.done}<small>/${d.total}</small>` : ''}</div>
      <button class="navbtn" data-act="nav" data-d="1" aria-label="Sonraki gün">›</button>
    </div>
    <div class="bar"><i style="width:${d.total ? Math.round(d.done / d.total * 100) : 0}%"></i></div>`;

  let h = '';
  const carry = isToday ? carryList() : [];
  if (carry.length) {
    const allYesterday = carry.every(t => t.date === addDays(ui.today, -1));
    h += `<div class="carry"><b>${allYesterday ? 'Dünden' : 'Önceki günlerden'} ${carry.length} iş kaldı</b>
      <div class="btns"><button class="pri" data-act="carryAll">Hepsini bugüne al</button><button data-act="carryPick">Tek tek seç</button><button data-act="carryIgnore">Yoksay</button></div></div>`;
  }
  h += '<div class="sec">Rutinler</div>';
  h += d.routines.length ? d.routines.map(({ r, st }) =>
      itemHTML('r', r.id, r.title, st === 'done' ? 'done' : st === 'skip' ? 'skip' : '',
        st === 'skip' ? 'atlandı' : (past && !st ? 'yapılmadı' : ''), past && !st)).join('')
    : `<div class="empty">${currentRoutines().length ? 'Bu gün için rutin yok.' : 'Henüz rutin yok. Rutinler sekmesinden ekleyebilirsin.'}</div>`;
  h += `<div class="sec">${isToday ? 'Bugüne özel' : 'Bu güne özel'}</div>`;
  h += d.tasks.length ? d.tasks.map(t => {
      const m = [];
      if (past && !t.done) m.push('yapılmadı');
      if (t.history.length) m.push(`↻ ${t.history.length} kez ertelendi`);
      return itemHTML('t', t.id, t.title, t.done ? 'done' : '', m.join(' · '), past && !t.done);
    }).join('')
    : '<div class="empty">Bu güne özel iş yok. Aşağıdan yazıp ekle.</div>';
  $('#main').innerHTML = h;
}

function gridHTML(ym, act, sel) {
  const [y, m] = ym.split('-').map(Number);
  const offset = (new Date(y, m - 1, 1).getDay() + 6) % 7, n = new Date(y, m, 0).getDate();
  const cnt = {};
  state.tasks.forEach(t => { const c = cnt[t.date] || (cnt[t.date] = { open: 0, total: 0 }); c.total++; if (!t.done) c.open++; });
  let h = '<div class="grid">' + DAYS_S.map(x => `<div class="dowh">${x}</div>`).join('') + '<div></div>'.repeat(offset);
  for (let i = 1; i <= n; i++) {
    const ds = `${ym}-${pad(i)}`, c = cnt[ds];
    const badge = !c ? '<span class="badge none">0</span>' : c.open ? `<span class="badge">${c.open}</span>` : '<span class="badge ok">✓</span>';
    h += `<button class="cell ${ds === ui.today ? 'today' : ''} ${ds < ui.today ? 'past' : ''} ${ds === sel ? 'sel' : ''}" data-act="${act}" data-date="${ds}"><span class="n">${i}</span>${badge}</button>`;
  }
  return h + '</div>';
}
const monthTitle = ym => { const [y, m] = ym.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const shiftMonth = (ym, n) => { const [y, m] = ym.split('-').map(Number); return fmt(new Date(y, m - 1 + n, 1)).slice(0, 7); };

function renderCal() {
  $('#hdr').innerHTML = `<div class="hrow">
      <button class="navbtn" data-act="nav" data-d="-1" aria-label="Önceki ay">‹</button>
      <div class="hmain"><div class="htitle">${monthTitle(ui.calMonth)}</div><div class="hsub">Güne dokun: listeyi aç, görev ekle</div></div>
      ${ui.calMonth === ui.today.slice(0, 7) ? '' : '<button class="chip" data-act="calToday">Bugün</button>'}
      <button class="navbtn" data-act="nav" data-d="1" aria-label="Sonraki ay">›</button></div>`;
  $('#main').innerHTML = gridHTML(ui.calMonth, 'openDay', ui.date);
}

function renderRoutines() {
  const list = currentRoutines();
  $('#hdr').innerHTML = `<div class="hrow"><div class="hmain"><div class="htitle">Rutinler</div><div class="hsub">Dokun: düzenle · Değişiklikler geçmişi etkilemez</div></div></div>`;
  $('#main').innerHTML = list.length ? list.map((r, i) => `<div class="ritem ${r.active ? '' : 'off'}">
      <button class="rmain" data-act="redit" data-id="${r.id}"><span class="title">${esc(r.title)}</span><span class="meta">${repeatText(r.days)}${r.active ? '' : ' · pasif'}</span></button>
      <button class="ord" data-act="rmove" data-d="-1" data-id="${r.id}" ${i === 0 ? 'disabled' : ''} aria-label="Yukarı">↑</button>
      <button class="ord" data-act="rmove" data-d="1" data-id="${r.id}" ${i === list.length - 1 ? 'disabled' : ''} aria-label="Aşağı">↓</button>
      <button class="switch ${r.active ? 'on' : ''}" data-act="rtoggle" data-id="${r.id}" role="switch" aria-checked="${r.active}" aria-label="Aktif"></button>
    </div>`).join('')
    : '<div class="empty">Her gün yapmak istediklerini buraya ekle: aşağıya yaz, Enter\'a bas. Varsayılan "her gün"; günleri değiştirmek için rutine dokun.</div>';
}

function renderSettings() {
  $('#hdr').innerHTML = `<div class="hrow"><div class="hmain"><div class="htitle">Ayarlar</div></div></div>`;
  const light = state.settings.theme === 'light';
  $('#main').innerHTML = `
    <div class="card"><h3>Yedek</h3><p>Veriler yalnızca bu cihazda durur. Ara sıra dışa aktarıp dosyayı sakla.</p>
      <button class="btn pri" data-act="export">Dışa aktar (JSON)</button>
      <button class="btn" data-act="import">İçe aktar</button></div>
    <div class="card"><h3>Tema</h3>
      <div class="row2"><button class="btn ${light ? '' : 'pri'}" data-act="theme" data-v="dark">Koyu</button><button class="btn ${light ? 'pri' : ''}" data-act="theme" data-v="light">Açık</button></div></div>
    <div class="card"><h3>Özet</h3><p style="margin:0">${currentRoutines().length} rutin · ${state.tasks.length} görev · ${Object.keys(state.log).length} günlük kayıt</p></div>`;
}

/* ============ Alt sayfa (sheet) ============ */
let sheetOpen = false, ctx = null, pickerCb = null, pickerMonth = null, confirmCb = null;
function openSheet(html) {
  $('#sheet').innerHTML = html;
  if (sheetOpen) return;
  sheetOpen = true;
  $('#sheet').hidden = $('#backdrop').hidden = false;
  history.pushState({ sheet: 1 }, '');           // Android geri tuşu sayfayı kapatsın
}
function closeSheet(fromPop) {
  if (!sheetOpen) return;
  sheetOpen = false;
  $('#sheet').hidden = $('#backdrop').hidden = true;
  if (!fromPop) history.back();
}
addEventListener('popstate', () => closeSheet(true));

function openItemMenu(kind, id) {
  ctx = { kind, id };
  if (kind === 't') {
    const t = findTask(id); if (!t) return;
    const next = addDays(t.date < ui.today ? ui.today : t.date, 1);
    openSheet(`<h2>${esc(t.title)}</h2>
      <button class="opt" data-act="mPostpone">${next === addDays(ui.today, 1) ? 'Yarına ertele' : 'Bir gün ertele'}<small>${shortDate(next)}</small></button>
      ${t.date !== ui.today ? '<button class="opt" data-act="mToday">Bugüne al</button>' : ''}
      <button class="opt" data-act="mPick">Tarih seç…</button>
      <button class="opt" data-act="mEdit">Düzenle</button>
      <button class="opt danger" data-act="mDelete">Sil</button>`);
  } else {
    const r = findRoutine(id); if (!r) return;
    const st = (state.log[ui.date] || {})[id];
    openSheet(`<h2>${esc(r.title)}</h2>
      <button class="opt" data-act="mSkip">${st === 'skip' ? 'Atlamayı geri al' : ui.date === ui.today ? 'Bugün atla' : 'Bu günü atla'}</button>
      ${r.end ? '' : '<button class="opt" data-act="mREdit">Rutini düzenle</button>'}`);
  }
}
function openPicker(title, cb, month) {
  pickerCb = cb; pickerMonth = month || ui.date.slice(0, 7); pickerTitle = title; drawPicker();
}
let pickerTitle = '';
function drawPicker() {
  openSheet(`<div class="hrow" style="margin-bottom:6px"><button class="navbtn" data-act="pmonth" data-d="-1">‹</button>
    <h2 style="flex:1;text-align:center;margin:0">${pickerTitle} · ${monthTitle(pickerMonth)}</h2>
    <button class="navbtn" data-act="pmonth" data-d="1">›</button></div>${gridHTML(pickerMonth, 'pick', null)}`);
}
function openConfirm(text, cb) {
  confirmCb = cb;
  openSheet(`<h2>${esc(text)}</h2><button class="opt danger" data-act="confirmYes">Sil</button><button class="opt" data-act="close">Vazgeç</button>`);
}
function openRoutineEdit(id) {
  const r = findRoutine(id); if (!r) return;
  ctx = { kind: 'r', id };
  openSheet(`<form id="routineForm"><h2>Rutini düzenle</h2>
    <input type="text" id="rTitle" value="${esc(r.title)}" maxlength="200" enterkeyhint="done">
    <div class="note">Tekrar günleri</div>
    <div class="days">${DAYS_S.map((d, i) => `<button type="button" data-act="dayChip" data-i="${i}" class="${!r.days || r.days.includes(i) ? 'on' : ''}">${d}</button>`).join('')}</div>
    <div class="row2"><button type="button" class="btn" data-act="daysPreset" data-v="0123456">Her gün</button><button type="button" class="btn" data-act="daysPreset" data-v="01234">Hafta içi</button></div>
    <button type="submit" class="btn pri">Kaydet</button>
    <button type="button" class="btn danger" data-act="rDelete">Rutini sil</button></form>`);
}

/* ============ Eylemler ============ */
function navigate(dir) {
  if (ui.tab === 'cal') ui.calMonth = shiftMonth(ui.calMonth, dir);
  else if (ui.tab === 'day') { ui.date = addDays(ui.date, dir); ui.addTarget = null; $('#main').scrollTop = 0; }
  render();
}
const A = {
  tab(el) { ui.tab = el.dataset.tab; if (ui.tab === 'day') ui.date = ui.today; if (ui.tab === 'cal') ui.calMonth = ui.date.slice(0, 7); ui.addTarget = null; $('#main').scrollTop = 0; render(); },
  nav(el) { navigate(+el.dataset.d); },
  goToday() { ui.date = ui.today; ui.addTarget = null; render(); },
  calToday() { ui.calMonth = ui.today.slice(0, 7); render(); },
  openDay(el) { ui.date = el.dataset.date; ui.tab = 'day'; ui.addTarget = null; $('#main').scrollTop = 0; render(); },
  close() { closeSheet(); },
  undo() { if (!undoSnap) return; state = normalize(JSON.parse(undoSnap)); undoSnap = null; $('#toast').hidden = true; save(); render(); },

  toggle(el) {
    const { kind, id } = el.dataset;
    if (kind === 't') { const t = findTask(id); t.done = !t.done; }
    else { const lg = state.log[ui.date] || (state.log[ui.date] = {}); if (lg[id]) delete lg[id]; else lg[id] = 'done'; }
    save(); render();
  },
  menu(el) { const it = el.closest('.item'); openItemMenu(it.dataset.kind, it.dataset.id); },

  // görev menüsü
  mPostpone() { const t = findTask(ctx.id), to = addDays(t.date < ui.today ? ui.today : t.date, 1); closeSheet(); mutate(`${shortDate(to)} gününe ertelendi`, () => moveTask(t, to)); },
  mToday() { const t = findTask(ctx.id); closeSheet(); mutate('Bugüne alındı', () => moveTask(t, ui.today)); },
  mPick() { const id = ctx.id; openPicker('Taşı', d => mutate(`${shortDate(d)} gününe taşındı`, () => moveTask(findTask(id), d)), findTask(id).date.slice(0, 7)); },
  mEdit() { const t = findTask(ctx.id); openSheet(`<form id="taskForm"><h2>Düzenle</h2><input type="text" id="tTitle" value="${esc(t.title)}" maxlength="200" enterkeyhint="done"><button type="submit" class="btn pri">Kaydet</button></form>`); const i = $('#tTitle'); i.focus(); i.select(); },
  mDelete() { const id = ctx.id; openConfirm(`"${findTask(id).title}" silinsin mi?`, () => mutate('Silindi', () => { state.tasks = state.tasks.filter(t => t.id !== id); })); },
  mSkip() { const id = ctx.id, date = ui.date; closeSheet(); const was = (state.log[date] || {})[id] === 'skip';
    mutate(was ? 'Atlama geri alındı' : 'Atlandı', () => { const lg = state.log[date] || (state.log[date] = {}); if (was) delete lg[id]; else lg[id] = 'skip'; }); },
  mREdit() { openRoutineEdit(ctx.id); },

  // tarih seçici / onay
  pmonth(el) { pickerMonth = shiftMonth(pickerMonth, +el.dataset.d); drawPicker(); },
  pick(el) { const cb = pickerCb; pickerCb = null; closeSheet(); cb && cb(el.dataset.date); },
  confirmYes() { const cb = confirmCb; confirmCb = null; closeSheet(); cb && cb(); },

  // hızlı ekleme: başka güne
  addDate() {
    openPicker('Hangi güne?', d => {
      const inp = $('#addInput'), v = inp.value.trim();
      if (v) { inp.value = ''; mutate(`${shortDate(d)} gününe eklendi`, () => addTask(v, d)); }
      else { ui.addTarget = d === ui.date ? null : d; render(); inp.focus(); }
    });
  },

  // devir
  carryAll() { mutate('Bugüne alındı', () => carryList().forEach(t => moveTask(t, ui.today))); },
  carryIgnore() { mutate('Yoksayıldı', () => carryList().forEach(t => { t.ignored = true; })); },
  carryPick() {
    openSheet(`<h2>Hangileri bugüne gelsin?</h2>${carryList().map(t => `<button class="pickrow on" data-act="pickToggle" data-id="${t.id}"><span class="check"></span><span class="txt"><span class="title">${esc(t.title)}</span><span class="meta">${shortDate(t.date)} ${DAYS_S[dow(t.date)]}</span></span></button>`).join('')}
      <div class="note">Seçilmeyenler kendi gününde "yapılmadı" olarak kalır.</div><button class="btn pri" data-act="carrySel">Seçilenleri bugüne al</button>`);
  },
  pickToggle(el) { el.classList.toggle('on'); },
  carrySel() {
    const ids = new Set([...document.querySelectorAll('#sheet .pickrow.on')].map(e => e.dataset.id));
    closeSheet();
    mutate(`${ids.size} iş bugüne alındı`, () => carryList().forEach(t => { if (ids.has(t.id)) moveTask(t, ui.today); else t.ignored = true; }));
  },

  // rutinler
  redit(el) { openRoutineEdit(el.dataset.id); },
  dayChip(el) { el.classList.toggle('on'); },
  daysPreset(el) { document.querySelectorAll('#sheet .days button').forEach(b => b.classList.toggle('on', el.dataset.v.includes(b.dataset.i))); },
  rtoggle(el) { const r = findRoutine(el.dataset.id); mutate(r.active ? 'Rutin pasifleştirildi' : 'Rutin aktif', () => toggleRoutineActive(r)); },
  rmove(el) {
    const list = currentRoutines(), i = list.findIndex(r => r.id === el.dataset.id), j = i + +el.dataset.d;
    if (i < 0 || j < 0 || j >= list.length) return;
    list.forEach((r, k) => { r.order = k; });
    [list[i].order, list[j].order] = [j, i];
    save(); render();
  },
  rDelete() { const id = ctx.id; openConfirm(`"${findRoutine(id).title}" rutini silinsin mi? Geçmiş kayıtlar korunur.`, () => mutate('Rutin silindi', () => deleteRoutine(findRoutine(id)))); },

  // ayarlar
  theme(el) { state.settings.theme = el.dataset.v; save(); render(); },
  export() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
    a.download = `ajandam-yedek-${ui.today}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Yedek indirildi');
  },
  import() { $('#importFile').value = ''; $('#importFile').click(); },
};

/* ---- Olay dinleyiciler ---- */
let suppressClick = false;
document.addEventListener('pointerdown', () => { suppressClick = false; }, true);
document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.stopPropagation(); e.preventDefault(); return; }
  const el = e.target.closest('[data-act]');
  if (el && A[el.dataset.act]) A[el.dataset.act](el, e);
}, true);

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'addBar') {
    const inp = $('#addInput'), v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    inp.value = '';
    if (ui.tab === 'routines') { addRoutine(v); save(); render(); }
    else {
      const d = ui.addTarget || ui.date, other = d !== ui.date;
      ui.addTarget = null;
      if (other) mutate(`${shortDate(d)} gününe eklendi`, () => addTask(v, d));
      else { addTask(v, d); save(); render(); $('#main').scrollTop = $('#main').scrollHeight; }
    }
    inp.focus();
  } else if (f.id === 'taskForm') {
    const v = $('#tTitle').value.trim(), t = findTask(ctx.id);
    closeSheet();
    if (v && t && v !== t.title) mutate('Güncellendi', () => { t.title = v; });
  } else if (f.id === 'routineForm') {
    const title = $('#rTitle').value.trim(), r = findRoutine(ctx.id);
    const on = [...document.querySelectorAll('#sheet .days button.on')].map(b => +b.dataset.i);
    if (!title) { $('#rTitle').focus(); return; }
    if (!on.length) { toast('En az bir gün seç'); return; }
    const days = on.length === 7 ? null : on;
    closeSheet();
    if (r && (title !== r.title || JSON.stringify(days) !== JSON.stringify(r.days || null)))
      mutate('Rutin güncellendi', () => editRoutine(r, title, days));
  }
});

$('#importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  file.text().then(txt => {
    let s; try { s = JSON.parse(txt); } catch (err) {}
    if (!valid(s)) { toast('Bu dosya geçerli bir Ajandam yedeği değil'); return; }
    mutate('Yedek yüklendi', () => { state = normalize(s); });
  });
});

/* Dokunma hareketleri: görevde sola kaydır / uzun bas = menü; boş alanda sağa-sola = gün/ay değiştir */
(() => {
  const main = $('#main');
  let g = null;
  const reset = () => { if (!g) return; clearTimeout(g.timer); if (g.item) g.item.style.transform = ''; g = null; };
  main.addEventListener('pointerdown', e => {
    suppressClick = false;
    if (ui.tab !== 'day' && ui.tab !== 'cal') return;
    const item = ui.tab === 'day' ? e.target.closest('.item') : null;
    g = { x: e.clientX, y: e.clientY, item, timer: null };
    if (item) g.timer = setTimeout(() => {
      const it = g && g.item; if (!it) return;
      reset(); suppressClick = true;
      if (navigator.vibrate) navigator.vibrate(12);
      openItemMenu(it.dataset.kind, it.dataset.id);
    }, 480);
  });
  main.addEventListener('pointermove', e => {
    if (!g) return;
    const dx = e.clientX - g.x, dy = e.clientY - g.y;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) clearTimeout(g.timer);
    if (g.item && dx < -10 && Math.abs(dx) > Math.abs(dy)) g.item.style.transform = `translateX(${Math.max(dx, -90)}px)`;
  });
  main.addEventListener('pointerup', e => {
    if (!g) return;
    const dx = e.clientX - g.x, dy = e.clientY - g.y, item = g.item;
    reset();
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (item) { if (dx < 0) { suppressClick = e.pointerType === 'mouse'; openItemMenu(item.dataset.kind, item.dataset.id); } }
    else { suppressClick = e.pointerType === 'mouse'; navigate(dx < 0 ? 1 : -1); }
  });
  main.addEventListener('pointercancel', reset);
  main.addEventListener('contextmenu', e => {
    const it = e.target.closest('.item'); if (!it) return;
    e.preventDefault();
    if (!sheetOpen) openItemMenu(it.dataset.kind, it.dataset.id);
  });
})();

/* Gün değişimi: uygulama açık kalıp ertesi gün öne gelirse bugüne geç */
function checkDay() {
  const now = fmt(new Date());
  if (now === ui.today) return;
  const wasOnToday = ui.date === ui.today;
  ui.today = now;
  if (wasOnToday) ui.date = now;
  render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDay(); });
setInterval(checkDay, 60000);

render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
